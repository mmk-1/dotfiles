[bar]
order = [ "default" ]

    [bar.default]
    border = "primary"
    capsule_thickness = 0.52999999187886715
    center = [ "active_window", "control-center" ]
    end = [ "tray", "group:g1", "group:g2", "group:g3" ]
    margin_ends = 20
    padding = 15
    shadow = false
    start = [ "wallpaper", "clock", "date", "media", "workspaces" ]
    widget_spacing = 8

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "primary"
        foreground = "on_primary"
        id = "g1"
        members = [ "network", "bluetooth" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "secondary"
        foreground = "on_primary"
        id = "g2"
        members = [ "volume", "brightness", "battery" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "tertiary"
        foreground = "on_tertiary"
        id = "g3"
        members = [ "clipboard", "notifications", "session" ]
        opacity = 1.0
        padding = 6.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 768.0
    cy = 778.0
    output = "eDP-1"
    placement_height = 960.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
lang = "en"

[theme]
builtin = "Nord"
community_palette = "GitHub Dark"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/mmk/pictures/wallpapers"

    [wallpaper.default]
    path = "/home/mmk/pictures/wallpapers/wallpaper3.png"

    [wallpaper.last]
    path = "/home/mmk/pictures/wallpapers/wallpaper3.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/mmk/pictures/wallpapers/wallpaper3.png"
