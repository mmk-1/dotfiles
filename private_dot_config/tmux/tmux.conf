# -----------------------------
# GENERAL & TERMINAL (KITTY)
# -----------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:usstyle:extkeys"
set -as terminal-features ",xterm-256color:RGB:usstyle:extkeys"

# Forward escape sequences (e.g. Kitty image protocol)
set -g allow-passthrough on

# Zero delay for ESC key in Vim/Neovim
set -s escape-time 0

# Forward modified key chords (e.g. Shift+Enter, Ctrl+Enter)
set -s extended-keys on

set -g history-limit 50000
set -g focus-events on
set -g mouse on
set -s set-clipboard on

# Stay inside tmux when killing a session
set -g detach-on-destroy off

# -----------------------------
# WINDOWS & PANES
# -----------------------------
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Border lines
set -g pane-border-lines single

# Prefix: Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config
unbind t
bind t source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Kill pane
unbind k
bind k kill-pane

# Splits and new windows retain current path
unbind '"'
unbind '%'
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Re-map session selector (since 's' was remapped to split-window)
bind S choose-tree -Zs

# Pane resizing
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5

# -----------------------------
# COPY MODE (VI)
# -----------------------------
set -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Keep selection active on mouse release
unbind -T copy-mode-vi MouseDragEnd1Pane
